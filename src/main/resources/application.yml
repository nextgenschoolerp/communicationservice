spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  application:
    name: communicationservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datasource}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/communicationservice}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      consume: [w3c, b3]
      produce: [w3c, b3]

logging:
  level:
    root: info
    com.kvs: debug
    com.kvs.core.logging.RequestAndRepositoryLoggingAspect: debug
    org.springframework.security: debug

communication:
  time-zone: ${COMMUNICATION_TIME_ZONE:Asia/Kolkata}
  # Help & support -> Contact support card (GET /api/v1/communication/support/contact)
  support:
    email: ${SUPPORT_EMAIL:helpdesk@yourschool.in}
    phone: ${SUPPORT_PHONE:+91 11 4000 1234}
    open-days: ${SUPPORT_OPEN_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY}
    opens-at: ${SUPPORT_OPENS_AT:08:00}
    closes-at: ${SUPPORT_CLOSES_AT:17:00}
    response-time: ${SUPPORT_RESPONSE_TIME:Usually within 2 hours}
  # circular delivery: called with the sender's own token (ServiceClients)
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8082/authservice}
    student-url: ${STUDENT_SERVICE_URL:http://localhost:8084/studentservice}
    hr-url: ${HR_SERVICE_URL:http://localhost:8088/hrservice}

kvs:
  # Schema-per-school routing (database/tenant-split, school_webapp/docs/tenant-schema-split-plan.md).
  # Leave off until the database has been split; when on, Hibernate ddl-auto is forced to none.
  tenancy:
    enabled: ${KVS_TENANCY_ENABLED:false}
    schema-map: ${KVS_TENANCY_SCHEMA_MAP:a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11=dpsdata,b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22=svmtdata,5eed0001-0000-4000-8000-000000000003=gmetdata}
    common-schema: ${KVS_TENANCY_COMMON_SCHEMA:common}
  # RBAC (school_webapp/docs/rbac-migration-log.md): endpoints check permission codes (config/CommunicationPerms);
  # ms-core loads each school's role → permission map from authservice (GET /internal/v1/role-grants, with
  # kvs.internal.key / KVS_INTERNAL_KEY, the same value as authservice's).
  rbac:
    resolver: ${KVS_RBAC_RESOLVER:http}
    authservice-url: ${AUTH_SERVICE_URL:http://localhost:8082/authservice}
  # Shared GET …/access-rules (ms-core): endpoints with the permissions and roles their @PreAuthorize allows
  access-rules:
    path: /api/v1/communication/access-rules
    base-package: com.kvs.communication
